name = "sams-personal-studio"
pages_build_output_dir = "public"
compatibility_date = "2025-01-01"

# Stores the schedule the owner edits. Create it once with:
#   npx wrangler kv namespace create SCHEDULE_KV
# then paste the id it prints below.
[[kv_namespaces]]
binding = "SCHEDULE_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

